title: Message
required:
  - destination_number
type: object
properties:
  callback_url:
    type: string
    description: |
      URL replies and delivery reports to this message will be pushed to.
      Must use the `http` or `https` scheme. Hostnames must conform to RFC 1123
      DNS name syntax. Paths must not contain whitespace or control characters.
      Invalid URLs are rejected with HTTP 400.
    example: https://my.url.com
  content:
    maxLength: 5000
    minLength: 1
    type: string
    description: >-
      Content of the message. Required for SMS, MMS, TTS, and RCS text. Up to
      5,000 characters for SMS, MMS and TTS (read aloud for TTS) and up to
      2,000 characters for RCS. Omit this field when sending RCS
      `rich_content`. Rich content (`rich_content` or `suggestions`) does not
      substitute for this field on an explicit `format: "SMS"` send — such
      requests are rejected with `400`.
    example: Hello world!
  destination_number:
    maxLength: 15
    minLength: 1
    type: string
    description: Destination number of the message
    example: '+61491570156'
  delivery_report:
    type: boolean
    description: Request a delivery report for this message
    example: false
  format:
    $ref: ./_format-schemas.yaml#/Format
  fallback_message:
    $ref: ./RcsFallbackMessage.yaml
  suggestions:
    $ref: ./RcsSuggestions.yaml
  rich_content:
    $ref: ./RcsRichContent.yaml
  message_expiry_timestamp:
    type: string
    description: Date time after which the message expires and will not be sent
    format: date-time
    example: '2027-03-01T09:00:00Z'
  metadata:
    type: object
    description: >-
      Metadata for the message specified as a set of key value pairs, each key
      can be up to 100 characters long and each value can be up to 256
      characters long

      ```

      {
         "myKey": "myValue",
         "anotherKey": "anotherValue"
      }

      ```
    example:
      myKey: myValue
      anotherKey: anotherValue
  scheduled:
    type: string
    description: Scheduled delivery date time of the message
    format: date-time
    example: '2027-03-01T09:00:00Z'
  source_number:
    type: string
    description: >-
      Sender for the message: a number or alpha tag registered to your
      account. When omitted, your account's default number is used. On an RCS
      message, it's the sender of the SMS `fallback_message` and isn't used
      when `fallback_message` is omitted.
    example: '+61491570157'
  source_number_type:
    $ref: ./SourceNumberType.yaml
  message_id:
    type: string
    description: Unique ID of this message
    format: uuid
  status:
    $ref: ./Status.yaml
  media:
    type: array
    items:
      type: string
    description: >-
      MMS only. List of publicly reachable URLs of media files. Supported
      formats are png, jpeg and gif. Requires `format: "MMS"`. Rejected with
      `400` on SMS, TTS and RCS messages.
    example:
      - https://cdn.example.com/ticket.png
  subject:
    type: string
    description: >-
      MMS only. Subject of the message, up to 64 characters. Rejected with
      `400` on other message types.
    example: Your ticket
