title: Message
required:
  - destination_number
type: object
anyOf:
  - required:
      - content
  - required:
      - body
properties:
  callback_url:
    type: string
    description: |
      URL replies and delivery reports to this message will be pushed to.
      Must use the `http` or `https` scheme. Hostnames must conform to RFC 1123
      DNS name syntax. Paths must not contain whitespace or control characters.
      Invalid URLs are rejected with HTTP 400.
    example: https://my.url.com
  content:
    maxLength: 5000
    minLength: 1
    type: string
    description: >-
      Content of the message. Required for SMS, MMS, TTS, and the new RCS text
      shape. New-shape RCS content has a 2,000-character maximum. Omit this
      field when using the legacy RCS `body` shape.
    example: Hello world!
  destination_number:
    maxLength: 15
    minLength: 1
    type: string
    description: Destination number of the message
    example: '+61491570156'
  delivery_report:
    type: boolean
    description: Request a delivery report for this message
    example: false
  format:
    $ref: ./_format-schemas.yaml#/Format
  fallback_message:
    type: object
    description: >-
      Optional SMS fallback for a new-shape RCS message. It never selects the
      outbound channel. If omitted, an explicit RCS send is RCS-or-nothing.
    required:
      - content
    properties:
      content:
        type: string
        minLength: 1
        maxLength: 5000
        description: Text sent as SMS when the recipient cannot receive RCS.
        example: Hello from us!
  suggestions:
    type: array
    maxItems: 10
    description: >-
      Optional tappable suggestions shown beneath a new-shape RCS message.
      Up to 10. Not supported with the legacy RCS `body` shape. Returned in
      request order on the response. Fields that do not apply to a
      suggestion's `type` are ignored and not returned.
    items:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - reply
            - url
            - dial
            - location
          description: >-
            Suggestion type. `reply` requires only `text`; `url` requires
            `url`; `dial` requires `phone_number`; `location` requires
            `coordinates`. Any other value, including `calendar`, is rejected
            with `400`.
        text:
          type: string
          maxLength: 25
          description: Button label. Required for every type.
          example: Talk to support
        postback_data:
          type: string
          description: >-
            Opaque value returned with the suggestion on the send response and
            on `GET /v1/messages/{messageId}`. It is not included in replies.
          example: SUPPORT
        url:
          type: string
          maxLength: 2048
          description: Required for a `url` suggestion. Must be a valid URL.
          example: https://example.com/help
        phone_number:
          type: string
          description: >-
            Required for a `dial` suggestion. International format.
          example: '+61391570100'
        coordinates:
          type: object
          description: Required for a `location` suggestion.
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
              format: double
              example: -37.8136
            longitude:
              type: number
              format: double
              example: 144.9631
        label:
          type: string
          maxLength: 1000
          description: Optional label for a `location` suggestion.
          example: Melbourne CBD
  body:
    type: array
    minItems: 1
    description: >-
      Legacy RCS payload shape. Supported unchanged when `format` is `RCS`.
      Do not combine it with `content`, `fallback_message`, `suggestions`,
      `source_number`, or `source_number_type`.
    items:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
            - media
            - actions
          description: Legacy RCS body element type.
        value:
          type: string
          maxLength: 5000
          description: Required for a `text` element.
        url:
          type: string
          format: uri
          description: Required for a `media` element.
        media_type:
          type: string
          enum:
            - image/jpeg
            - image/png
          description: Required for a `media` element.
        items:
          type: array
          maxItems: 10
          description: Legacy RCS actions. Used only on an `actions` element.
          items:
            type: object
            additionalProperties: true
  message_expiry_timestamp:
    type: string
    description: Date time after which the message expires and will not be sent
    format: date-time
    example: '2016-11-03T11:49:02.807Z'
  metadata:
    type: object
    description: >-
      Metadata for the message specified as a set of key value pairs, each key
      can be up to 100 characters long and each value can be up to 256
      characters long

      ```

      {
         "myKey": "myValue",
         "anotherKey": "anotherValue"
      }

      ```
    example:
      myKey: myValue
      anotherKey: anotherValue
  scheduled:
    type: string
    description: Scheduled delivery date time of the message
    format: date-time
    example: '2016-11-03T11:49:02.807Z'
  source_number:
    type: string
    description: >-
      SMS sender used only when a new-shape RCS message falls back to SMS.
      Accepted but unused when `fallback_message` is omitted. Not supported
      with the legacy RCS `body` shape.
    example: '+61491570156'
  source_number_type:
    $ref: ./SourceNumberType.yaml
  message_id:
    type: string
    description: Unique ID of this message
    format: uuid
  status:
    $ref: ./Status.yaml
  media:
    type: array
    items:
      type: string
    description: >-
      The media is used to specify a list of URLs of the media file(s) that you
      are trying to send. Supported file formats include png, jpeg and gif.
      format parameter must be set to MMS for this to work.
    example:
      - >-
        https://images.pexels.com/photos/1018350/pexels-photo-1018350.jpeg?cs=srgb&dl=architecture-buildings-city-1018350.jpg
  subject:
    type: string
    description: >-
      The subject field is used to denote subject of the MMS message and has a
      maximum size of 64 characters long
    example: New Products
