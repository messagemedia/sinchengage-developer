title: GetAllApprovedSenderAddresses
type: object
properties:
  data:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Approved sender address UUID (use for get, update, re-verify, and delete)
          example: 7927d9eb-4e74-4021-836e-6cae071f84e7
        sender_address:
          type: string
          description: The sender address value (alpha tag or phone number as a string)
          example: EXAMPLE1
        sender_address_type:
          type: string
          description: The Sender Address Type
          enum:
            - ALPHANUMERIC
            - INTERNATIONAL
            - SHORT_CODE
        usage_type:
          type: string
          description: The Sender Address Usage Type
          enum:
            - ALPHANUMERIC
            - OWN_NUMBER
            - DEDICATED
            - HOSTED_NUMBER
        destination_countries:
          type: array
          description: list of 2-character ISO country codes this sender address applies to
          items:
            type: string
        reason:
          type: string
        label:
          type: string
        account_id:
          type: string
          description: Account that owns this sender address
          example: my_account
        created_date:
          type: string
          format: date-time
        last_modified_date:
          type: string
          format: date-time
        expiry:
          type: string
          format: date-time
          description: >
            The Sender Address expiration time (apply for sender_address_type =
            OWN_NUMBER)
        display_status:
          type: string
          description: >
            The Sender Address status (apply for sender_address_type =
            OWN_NUMBER)
          enum:
            - APPROVED
            - EXPIRING
            - EXPIRED
  pagination:
    type: object
    properties:
      page_size:
        type: number
      next_token:
        type: string
        description: The pagination token of the next set of results.
