format:
  title: MessageType
  type: array
  deprecated: true
  items:
    type: string
    enum:
      - MMS
      - SMS
      - TTS
      - RCS
      - CHANNEL
  description: >-
    Format of message type. Deprecated — use the `channels` parameter instead,
    which provides equivalent and expanded message-type filtering.
  example:
    - MMS
    - TTS
channels:
  title: Channels
  description: Filter the report by one or more channels.
  type: array
  items:
    type: string
    enum:
      - SMS
      - MMS
      - TTS
      - RCS
      - WHATSAPP
      - CHANNEL
  example:
    - SMS
    - WHATSAPP
Format:
  title: Format
  enum:
    - SMS
    - TTS
    - MMS
    - RCS
  type: string
  description: >-
    Outbound message channel. Optional — when omitted, the channel is inferred
    from the payload: if `rich_content` or `suggestions` is present the message
    is sent as RCS; otherwise it is sent as SMS. Setting `format: "SMS"`
    together with `rich_content` or `suggestions` is rejected with `400`.
    Set to `RCS` to force RCS without relying on inference.
  example: SMS
