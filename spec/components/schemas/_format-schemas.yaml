format:
  title: MessageType
  type: array
  deprecated: true
  items:
    type: string
    enum:
      - MMS
      - SMS
      - TTS
      - RCS
      - CHANNEL
  description: >-
    Format of message type. Deprecated — use the `channels` parameter instead,
    which provides equivalent and expanded message-type filtering.
  example:
    - MMS
    - TTS
channels:
  title: Channels
  description: Filter the report by one or more channels.
  type: array
  items:
    type: string
    enum:
      - SMS
      - MMS
      - TTS
      - RCS
      - WHATSAPP
      - CHANNEL
  example:
    - SMS
    - WHATSAPP
Format:
  title: Format
  enum:
    - SMS
    - TTS
    - MMS
  type: string
  description: Filter results by message format, using enumerable MessageType.
  example: SMS
