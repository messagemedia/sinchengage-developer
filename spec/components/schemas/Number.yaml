title: Number
required:
  - number
  - authorised
type: object
description: Number authorisation result for a single phone number
properties:
  number:
    type: string
    description: Phone number as a string
    example: "+61491570156"
  authorised:
    type: boolean
    description: Whether the authenticated account is authorised to use this number
example:
  number: "+61491570156"
  authorised: true
