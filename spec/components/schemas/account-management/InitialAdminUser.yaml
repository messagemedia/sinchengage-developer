type: object
required:
  - first_name
  - last_name
  - phone
properties:
  first_name:
    type: string
    description: Name cannot have more than one sequential space.
    minLength: 1
    maxLength: 40
    pattern: ^((?!\s{2}).)*$
  last_name:
    type: string
    description: Name cannot have more than one sequential space.
    minLength: 1
    maxLength: 80
    pattern: ^((?!\s{2}).)*$
  email:
    type: string
    format: email
    description: >-
      Hub login address. Required to match an existing user or to send the
      invitation / welcome email. If omitted, the sub-account is still created
      with first name, last name, and phone, but no Hub invite is sent and
      existing users cannot be matched by email.
    example: first.last@email.com
  phone:
    type: string
    description: >-
      Phone number. Must start with `+` followed by 7–250 digits (AMS field
      limit). Use full E.164 where possible (for example `+61412345678`).
    minLength: 7
    maxLength: 250
    pattern: ^\+[0-9]{7,250}$
    example: "+61411111111"
example:
  first_name: First
  last_name: Last
  email: first.last@email.com
  phone: "+61411111111"
