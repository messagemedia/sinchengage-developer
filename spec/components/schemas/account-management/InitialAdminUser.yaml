type: object
required:
  - first_name
  - last_name
  - phone
properties:
  first_name:
    type: string
    description: Name cannot have more than one sequential space.
    minLength: 1
    maxLength: 40
    pattern: ^((?!\s{2}).)*$
  last_name:
    type: string
    description: Name cannot have more than one sequential space.
    minLength: 1
    maxLength: 80
    pattern: ^((?!\s{2}).)*$
  email:
    type: string
    description: Should be a valid email address.
    example: first.last@email.com
  phone:
    type: string
    description: Phone number in E.164 format. '+' is mandatory.
    minLength: 7
    maxLength: 250
    example: "+61411111111"
example:
  first_name: First
  last_name: Last
  email: first.last@email.com
  phone: "+61411111111"
