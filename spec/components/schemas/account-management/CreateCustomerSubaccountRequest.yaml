type: object
required:
  - company_name
  - timezone
  - operating_country
  - billing_type
  - user
properties:
  company_name:
    type: string
    description: >-
      Company name can contain any character except the `./` substring. This is
      used to generate an account unique identifier.
    minLength: 2
    maxLength: 200
    pattern: ^((?!\./).){2,200}$
    example: Subaccount Name
  timezone:
    type: string
    description: IANA time zone name used for Sinch Engage and reports.
    example: Australia/Melbourne
  operating_country:
    type: string
    description: >-
      Primary country the account will send messages to. Use one of `AU`,
      `NZ`, `UK`, or `US`.
    enum:
      - AU
      - NZ
      - UK
      - US
    minLength: 2
    maxLength: 2
    example: AU
  billing_type:
    type: string
    enum:
      - POSTPAID
    description: Billing type of the partner customer. Always set to `POSTPAID`.
    example: POSTPAID
  user:
    $ref: ./InitialAdminUser.yaml
example:
  company_name: Subaccount Name
  timezone: Australia/Melbourne
  operating_country: AU
  billing_type: POSTPAID
  user:
    first_name: First
    last_name: Last
    email: first.last@email.com
    phone: "+61411111111"
