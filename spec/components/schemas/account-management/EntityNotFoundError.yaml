type: object
properties:
  id:
    type: string
    description: UUID identifying the error.
    example: 1fb233c2-5d13-4318-b8c8-8da91fcc0e38
  timestamp:
    type: string
    description: UTC instant when the error happened.
    example: "2020-05-29T01:39:30.887Z"
  code:
    type: string
    description: Machine-readable code.
    example: ENTITY_NOT_FOUND
  context:
    type: object
    description: More information about the error.
    properties:
      details:
        type: string
        description: Description of what went wrong.
        example: Description of what went wrong.
      statusCode:
        type: number
        description: Status code for the error.
        example: 404
  message:
    type: string
    description: The error message.
    example: Description of what went wrong.
