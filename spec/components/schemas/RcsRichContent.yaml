title: RcsRichContent
type: object
description: >-
  Rich content for an RCS message, sent instead of `content`. Its presence
  causes the channel to be inferred as RCS when `format` is omitted — you do
  not need to set `format: "RCS"` explicitly. Setting `format: "SMS"` together
  with `rich_content` is rejected with `400`, whether or not `content` is
  present. Include exactly one of `media`, `card`, `carousel`, or `location`.
  Do not combine it with `content` or top-level `suggestions`. `fallback_message`
  is supported and is sent as plain SMS text.
additionalProperties: false
properties:
  media:
    $ref: ./RcsRichMedia.yaml
  card:
    $ref: ./RcsRichCard.yaml
  carousel:
    $ref: ./RcsRichCarousel.yaml
  location:
    $ref: ./RcsRichLocation.yaml
