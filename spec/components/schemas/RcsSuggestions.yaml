title: RcsSuggestions
type: array
maxItems: 10
description: >-
  Optional tappable suggestions shown beneath an RCS text message.
  Up to 10. Not supported with `rich_content`. Returned in
  request order on the response. Fields that do not apply to a
  suggestion's `type` are ignored and not returned.
