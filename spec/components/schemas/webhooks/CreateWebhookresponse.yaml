title: CreateWebhookresponse
required:
  - id
  - url
  - method
type: object
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier for the webhook.
  url:
    type: string
  method:
    type: string
  encoding:
    type: string
  headers:
    $ref: ./Headers.yaml
  events:
    type: array
    items:
      type: string
    description: Webhook event types subscribed to.
  template:
    type: string
  read_timeout:
    type: integer
    description: The read timeout for the webhook call in milliseconds.
  retries:
    type: integer
    description: The number of times to retry a failed webhook call.
  retry_delay:
    type: integer
    description: The delay between retries in seconds.
example:
  id: 76fa7010-8c1f-4a24-917a-4d62a54e744d
  url: http://webhook.com
  method: POST
  encoding: JSON
  headers:
    Account: DeveloperPortal7000
  events:
    - ENROUTE_DR
    - DELIVERED_DR
  template: '{"id":"$mtId","status":"$statusCode"}'
  read_timeout: 5000
  retries: 3
  retry_delay: 30
