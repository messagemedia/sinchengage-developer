title: insightsitemresponse
type: object
properties:
  group:
    type: string
    example: Account1
  date:
    type: string
    description: "One or more dates seperated by a comma, e.g. 2022-05-18,2022-05-19"
    example: "2020-11-01"
  total_sent:
    type: number
    example: 60
  total_received:
    type: number
    example: 30
  total_billing_units:
    type: number
    example: 90
  total_opt_out:
    type: number
    example: 7
  sub_groups:
    type: array
    items:
      $ref: ./insightssubitemresponse.yaml
