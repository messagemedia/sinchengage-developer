title: scheduledsummaryreport
type: object
required:
  - label
  - schedule
  - report
properties:
  label:
    type: string
    example: Weekly Report
    description: The label of the report schedule
  schedule:
    $ref: ./schedule.yaml
  report:
    $ref: ./scheduledsummaryrequest.yaml
  metadata:
    type: array
    description: >-
      Metadata for the message as a list of key/value pairs. Each key can be up
      to 100 characters long and each value can be up to 256 characters long.

      ```

      [
         {
            "key": "myKey",
            "value": "myValue"
         },
         {
            "key": "anotherKey",
            "value": "anotherValue"
         }
      ]

      ```
    items:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    example:
      - key: myKey
        value: myValue
      - key: anotherKey
        value: anotherValue
