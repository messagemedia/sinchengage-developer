title: scheduleddetailrequest
type: object
description: A scheduled detail report request
required:
  - period
properties:
  period:
    $ref: ./ReportPeriod.yaml
  timezone:
    type: string
    example: Australia/Sydney
    description: The standard timezone name
  direction:
    $ref: ../MessageDirection.yaml
  source:
    type: string
    example: '+61555555555'
    description: Filter results by source address.
  sources:
    description: >-
      Filter results by multiple source addresses. This property overrides the
      `source` parameter.
    type: array
    items:
      type: string
    example:
      - '+61555555555'
      - '+614987654321'
  destination:
    type: string
    example: '+61555555555'
    description: Filter results by destination address.
  destinations:
    description: >-
      Filter results by multiple destination addresses. This property overrides
      the `destination` parameter.
    type: array
    items:
      type: string
    example:
      - '+61555555555'
      - '+614987654321'
  addresses:
    description: >-
      Filter messages where source OR destination matches one of the provided
      values. This parameter can only be set when `direction` is `all` and
      cannot be used in the same request as the `source`, `destination`,
      `sources`, or `destinations` parameters.
    type: array
    items:
      type: string
    example:
      - '+61400000001'
      - '+61400000002'
  message_format:
    $ref: ../_format-schemas.yaml#/format
  channels:
    $ref: ../_format-schemas.yaml#/channels
  metadata_key:
    type: string
    example: broadcastId
    description: Filter results for messages that include a metadata key.
  metadata_value:
    type: string
    example: ABC
    description: >-
      Filter results for messages that include a metadata key containing this
      value. If this parameter is provided, the metadata_key parameter must also
      be provided.
  accounts:
    type: array
    items:
      type: string
    example:
      - Account1
      - Account2
    description: >-
      Filter results by a specific account. By default results will be returned
      for the account associated with the authentication credentials and all
      sub-accounts.
  status:
    type: array
    items:
      $ref: ../MessageStatus.yaml
    description: An array of message statuses.
  opt_out:
    type: boolean
    example: true
    description: Filter the report to only include messages that triggered an opt-out
  delivery_options:
    type: array
    items:
      $ref: ../deliveryOptionsBody.yaml
    description: A list of options to configure the delivery of the report.
