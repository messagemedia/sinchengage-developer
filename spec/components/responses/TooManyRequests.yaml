description: >-
  Too many requests. The rate limit was exceeded. Wait the number of seconds
  in the `Retry-After` header, then retry the request.
headers:
  Retry-After:
    $ref: ../headers/RetryAfter.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/ApiError.yaml
    example:
      uuid: 025e93d3-051b-43f9-b12e-4b5842228dee
      type: too_many_requests
      title: Rate limit exceeded
      detail: Too many requests, please retry later
