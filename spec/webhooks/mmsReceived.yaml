post:
  security: []
  tags:
    - Webhook Payloads
  summary: MMS received webhook
  description: >-
    Sent to the `url` configured on a webhook subscribed to `RECEIVED_MMS`
    (see the Create webhook operation under Webhooks Management). Same
    shape as the SMS received webhook, except that the sample `template`
    branches on media: it emits `attachments` when the reply carries media
    and falls back to `content` when it does not, never both. The body
    shown here is the default/example shape produced by the sample
    `template` on that operation; the actual JSON structure is fully
    controlled by the `template` you configure, so treat this as a
    suggested default rather than a fixed contract.


    If your account has `API_SECURE_CALLBACKS` enabled with an active
    signature key (see Signature Key Management), this request is signed so
    you can verify it came from Sinch. The signature is carried in these
    headers:


    - `X-MessageMedia-Signature` — the signed digest, base64-encoded.

    - `X-MessageMedia-Digest-Type` — digest algorithm used, for example
    `SHA-512`.

    - `X-MessageMedia-Cipher-Type` — signing algorithm used, for example
    `RSA`.

    - `X-MessageMedia-Key-Id` — UUID of the signing key, so you can select
    the right public key from Signature Key Management.


    The signed value is the request line, followed by the `Date` header sent
    on the request, followed by the request body.
  operationId: MmsReceivedWebhook
  requestBody:
    description: MMS received webhook payload.
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/webhooks/payloads/MmsReceivedWebhookPayload.yaml
        examples:
          withAttachments:
            summary: Reply carrying media — emits `attachments`
            value:
              account_id: DeveloperPortal7000
              reply_id: a175e797-2b54-468b-9850-41a3eab32f74
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2016-12-07T08:44:00.850Z'
              message_id: 877c19ef-fa2e-4cec-827a-e1df9b5509f7
              attachments:
                - content_type: image/png
                  content: dGVzdA==
                  original_name: file.png
              metadata:
                myKey: myValue
          textOnly:
            summary: Reply with no media — falls back to `content`
            value:
              account_id: DeveloperPortal7000
              reply_id: a175e797-2b54-468b-9850-41a3eab32f74
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2016-12-07T08:44:00.850Z'
              message_id: 877c19ef-fa2e-4cec-827a-e1df9b5509f7
              content: Hello back
              metadata:
                myKey: myValue
  responses:
    "200":
      description: >-
        Your endpoint acknowledged the reply. Any 2xx response is treated
        as successful delivery.
    "400":
      description: >-
        Your endpoint returned an error response. Delivery is retried
        according to the `retries` / `retry_delay` configured on the
        webhook (see Create webhook).
