post:
  security: []
  tags:
    - Webhook Payloads
  summary: RCS received webhook
  description: >-
    Sent when a customer replies to an RCS message you sent with `content`,
    `suggestions` or `rich_content`. It goes to the reply webhook: an account
    webhook subscribed to replies, or the message's `callback_url`. The body
    shown here is the default/example shape produced by the RCS branch of the
    sample reply `template` on the Create webhook operation under Webhooks
    Management; the actual JSON structure is fully controlled by the
    `template` you configure, so treat this as a suggested default rather
    than a fixed contract.


    For RCS, the sample template sends `contact_message` and `messageid` in
    place of `content`. `contact_message` holds exactly one of four reply
    kinds: `text_message`, `media_message`, `location_message` or
    `choice_response_message` (a tap on a suggestion). `messageid` is the ID
    of the message being replied to; use it to correlate the reply, not
    `choice_response_message.message_id`, which is an internal Sinch
    identifier.


    Suggestion taps are webhook-only: [Check
    replies](#tag/Replies/operation/CheckReplies) does not return them. Free-text
    RCS replies are also returned there, in a different (polling) shape.


    If your account has `API_SECURE_CALLBACKS` enabled with an active
    signature key (see Signature Key Management), this request is signed so
    you can verify it came from Sinch. The signature is carried in these
    headers:


    - `X-MessageMedia-Signature` — the signed digest, base64-encoded.

    - `X-MessageMedia-Digest-Type` — digest algorithm used, for example
    `SHA-512`.

    - `X-MessageMedia-Cipher-Type` — signing algorithm used, for example
    `RSA`.

    - `X-MessageMedia-Key-Id` — UUID of the signing key, so you can select
    the right public key from Signature Key Management.


    The signed value is the request line, followed by the `Date` header sent
    on the request, followed by the request body.
  operationId: RcsReceivedWebhook
  requestBody:
    description: RCS received webhook payload.
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/webhooks/payloads/RcsReceivedWebhookPayload.yaml
        examples:
          text:
            summary: Text reply
            value:
              account_id: DeveloperPortal7000
              reply_id: a175e797-2b54-468b-9850-41a3eab32f74
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2027-03-01T09:15:00.000Z'
              message_id: 877c19ef-fa2e-4cec-827a-e1df9b5509f7
              messageid: 877c19ef-fa2e-4cec-827a-e1df9b5509f7
              contact_message:
                text_message:
                  text: Yes please
              metadata:
                myKey: myValue
          media:
            summary: Media reply
            value:
              account_id: DeveloperPortal7000
              reply_id: b286f8a8-3c65-479c-a961-52b4fbc43f85
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2027-03-01T09:15:00.000Z'
              message_id: 3f2a9c1e-8b47-4d65-9e0a-6c1d5b7f2e84
              messageid: 3f2a9c1e-8b47-4d65-9e0a-6c1d5b7f2e84
              contact_message:
                media_message:
                  url: https://cdn.example.com/inbound/photo.jpg
              metadata:
                myKey: myValue
          location:
            summary: Location reply
            value:
              account_id: DeveloperPortal7000
              reply_id: c397a9b9-4d76-48ad-b072-63c5a0d54a96
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2027-03-01T09:15:00.000Z'
              message_id: 5c0e2f1a-3b7d-4e89-a1c4-7d2b9e6f4a10
              messageid: 5c0e2f1a-3b7d-4e89-a1c4-7d2b9e6f4a10
              contact_message:
                location_message:
                  coordinates:
                    latitude: -33.8688
                    longitude: 151.2093
                  title: Location
                  label: ''
              metadata:
                myKey: myValue
          suggestionTap:
            summary: Suggestion tap (webhook only)
            value:
              account_id: DeveloperPortal7000
              reply_id: d4a8bac0-5e87-49be-8183-74d6b1e65ba7
              destination_number: '+61491593156'
              source_number: '+61491570156'
              date_received: '2027-03-01T09:15:00.000Z'
              message_id: 9a1b7c2d-6e3f-4a58-b9c0-1d2e3f4a5b6c
              messageid: 9a1b7c2d-6e3f-4a58-b9c0-1d2e3f4a5b6c
              contact_message:
                choice_response_message:
                  message_id: 01M76KTMPGXDPV1VJZF10Q8BVH
                  postback_data: TRACK_1234
              metadata:
                myKey: myValue
  responses:
    "200":
      description: >-
        Your endpoint acknowledged the reply. Any 2xx response is treated
        as successful delivery.
    "400":
      description: >-
        Your endpoint returned an error response. Delivery is retried
        according to the `retries` / `retry_delay` configured on the
        webhook (see Create webhook).
