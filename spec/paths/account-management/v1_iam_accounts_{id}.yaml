delete:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Account Management
  summary: Delete customer account
  description: Use this endpoint to delete the specified account.
  operationId: DeleteCustomerAccount
  parameters:
    - name: id
      in: path
      required: true
      description: Account id to delete.
      schema:
        type: string
        example: MyTestAccount_ZQR_0001
      example: MyTestAccount_ZQR_0001
  responses:
    "204":
      description: Account deleted successfully. No content.
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      description: Invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/SimpleError.yaml
          example:
            message: Invalid authentication credentials
    "404":
      description: Account not found.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/EntityNotFoundError.yaml
          example:
            id: 1fb233c2-5d13-4318-b8c8-8da91fcc0e38
            timestamp: "2020-05-29T01:39:30.887Z"
            code: ENTITY_NOT_FOUND
            context:
              details: Description of what went wrong.
              statusCode: 404
            message: Description of what went wrong.
    "500":
      description: Server error.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/ServerError.yaml
          example:
            id: 1fb233c2-5d13-4318-b8c8-8da91fcc0e38
            timestamp: "2020-05-29T01:39:30.887Z"
            code: SERVER_ERROR
            message: Description of what went wrong.
