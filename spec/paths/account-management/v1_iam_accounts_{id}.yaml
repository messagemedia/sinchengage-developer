delete:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Account Management
  summary: Delete customer account
  description: >-
    Permanently delete the sub-account identified by `id`. This does not
    delete the authenticated parent. Deletion is irreversible: Hub users lose
    access to that sub-account, and messaging for that account stops once it
    is removed. You can only delete a sub-account you are allowed to manage.
  operationId: DeleteCustomerAccount
  parameters:
    - name: id
      in: path
      required: true
      description: Account id to delete.
      schema:
        type: string
        example: MyTestAccount_ZQR_0001
      example: MyTestAccount_ZQR_0001
  responses:
    "204":
      description: Account deleted successfully. No content.
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      description: >-
        Authenticated but not allowed to delete this account (for example,
        it is not a sub-account you own). Distinct from `401`, which means
        no valid credentials were provided.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/SimpleError.yaml
          example:
            message: Not allowed to delete this account
    "404":
      description: Account not found.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/EntityNotFoundError.yaml
          example:
            id: 1fb233c2-5d13-4318-b8c8-8da91fcc0e38
            timestamp: "2020-05-29T01:39:30.887Z"
            code: ENTITY_NOT_FOUND
            context:
              details: Description of what went wrong.
              statusCode: 404
            message: Description of what went wrong.
    "500":
      description: Server error.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/ServerError.yaml
          example:
            id: 1fb233c2-5d13-4318-b8c8-8da91fcc0e38
            timestamp: "2020-05-29T01:39:30.887Z"
            code: SERVER_ERROR
            message: Description of what went wrong.
