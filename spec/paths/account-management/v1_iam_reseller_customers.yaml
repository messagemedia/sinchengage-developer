post:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Account Management
  summary: Create customer subaccount
  description: >-
    Create a new sub-account with a user attached so the sub-account can start
    sending messages from the Hub.


    Each of the following account properties is required to successfully create
    an account:


    - `company_name`: A human-readable name for the sub-account that appears as
    the account name in the Hub web portal.

    - `timezone`: Timezone for the account. Timezones are used to present
    datetime in local time in the Hub web portal and in any reports. For
    example `Australia/Melbourne`, `Pacific/Auckland`.

    - `operating_country`: The primary country the account will send messages
    to. Use one of `AU`, `NZ`, `UK`, or `US`. `UK` is the AMS country code
    for the United Kingdom (not ISO-3166 `GB`).

    - `billing_type`: Always set to `POSTPAID` for this API.

    - `user`: Required. Details of the initial admin user on the sub-account.
    If `user.email` matches an existing platform user, they are added to the
    account and sent an invitation email. If the email is new, they receive a
    welcome email and must follow the activation link to set a password. If
    `user.email` is omitted, no invite is sent.

      - `first_name`: The user's first name.

      - `last_name`: The user's last name.

      - `email`: Optional. Hub login address used to match existing users and
      to send the invite or welcome email.

      - `phone`: Required. Must start with `+` followed by 7–250 digits. Prefer
      full E.164 (for example `+61412345678`).


    This API is intended primarily for reseller (parent) accounts. To perform
    messaging and related API calls *on behalf of* an existing sub-account,
    use the `Account` header described in the Sub-accounts guide instead.
  operationId: CreateCustomerSubaccount
  parameters:
    - name: Account
      in: header
      description: >-
        Parent account to nest the new sub-account under. Omit this header to
        create the sub-account directly under the authenticated parent. This
        is not the Sub-accounts `Account` header used to send messages on
        behalf of an existing sub-account.
      schema:
        type: string
        example: TestAccount_ABC_0001
      example: TestAccount_ABC_0001
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: >-
            ../../components/schemas/account-management/CreateCustomerSubaccountRequest.yaml
        example:
          company_name: Subaccount Name
          timezone: Australia/Melbourne
          operating_country: AU
          billing_type: POSTPAID
          user:
            first_name: First
            last_name: Last
            email: first.last@email.com
            phone: '+61411111111'
  responses:
    "201":
      description: Customer subaccount created.
      content:
        application/json:
          schema:
            $ref: >-
              ../../components/schemas/account-management/CreateCustomerSubaccountResponse.yaml
          example:
            parent_account: TestAccount_ABC_0001
            account_id: TestAccount_ABC_0002
    "400":
      description: Request parameter is invalid.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/ValidationError.yaml
          example:
            message: Request parameter is invalid
            details:
              - Detailed error message
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "404":
      description: Not found.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/SimpleError.yaml
          example:
            message: Not Found
    "500":
      description: Server error.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account-management/SimpleError.yaml
          example:
            message: Something went wrong
