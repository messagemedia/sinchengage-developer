delete:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Webhooks Management
  summary: Delete webhook
  description: >-
    Delete a webhook that was previously created for the connected account.

    A webhook can be cancelled by appending the UUID of the webhook to the
    endpoint and submitting a DELETE request to the /webhooks/messages endpoint.


    A successful request to the retrieve webhook endpoint will return a null
    response.


    *Note: Only pre-created webhooks can be deleted. If an invalid or non
    existent webhook ID parameter is specified in the request, then a HTTP 404
    Not Found response will be returned.*
  operationId: DeleteWebhook
  parameters:
    - name: webhookId
      in: path
      description: Unique identifier of the webhook.
      required: true
      style: simple
      schema:
        type: string
        format: uuid
        example: a7f11bb0-f299-4861-a5ca-9b29d04bc5ad
      example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
  responses:
    "204":
      description: Webhook deleted successfully
      headers: {}
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "404":
      description: Not found.
patch:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Webhooks Management
  summary: Update webhook
  description: >-
    Update a webhook. You can update individual attributes or all of them by
    submitting a PATCH request to the /webhooks/messages endpoint (the same
    endpoint used above to delete a webhook).


    All fields in the request body are optional, but at least one must be
    provided. An empty body or a body with all null fields will be rejected.


    A successful request to the update webhook endpoint will return a response
    body as follows:


    ```

    {
        "id": "76fa7010-8c1f-4a24-917a-4d62a54e744d",
        "url": "http://webhook.com",
        "method": "POST",
        "encoding": "JSON",
        "headers": {},
        "events": [
            "ENROUTE_DR",
            "DELIVERED_DR"
        ],
        "template": "{\"id\":\"$mtId\",\"status\":\"$statusCode\"}",
        "read_timeout": 5000,
        "retries": 3,
        "retry_delay": 30
    }

    ```


    *Note: Only pre-created webhooks can be updated. If an invalid or non
    existent webhook ID parameter is specified in the request, then a HTTP 404
    Not Found response will be returned.*


    *Note: A 400 response will be returned if the request body cannot be parsed,
    the `url` is invalid (for example, malformed hostname or DNS syntax,
    unsupported scheme such as `ftp`, or path containing whitespace or control
    characters — e.g. `https://-invalid.com`, `https://invalid_.com`,
    `https:///path`, `https://:/path`, `http://.example.com`,
    `http://example..com`), an `events` value is not recognised (e.g.
    `RECEIVED_123`), the `events`, `encoding` or `method` is null, or the
    `headers` has a Content-Type attribute.*
  operationId: UpdateWebhook
  parameters:
    - name: webhookId
      in: path
      description: Unique identifier of the webhook.
      required: true
      style: simple
      schema:
        type: string
        format: uuid
        example: a7f11bb0-f299-4861-a5ca-9b29d04bc5ad
      example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
  requestBody:
    description: Request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/webhooks/UpdateWebhookrequest.yaml
        example:
          url: http://webhook.com
          method: POST
          encoding: JSON
          headers: {}
          events:
            - ENROUTE_DR
            - DELIVERED_DR
          template: "{\"id\":\"$mtId\",\"status\":\"$statusCode\"}"
    required: true
  responses:
    "200":
      description: Webhook updated successfully
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/webhooks/CreateWebhookresponse.yaml
    "400":
      description: Unexpected error in API call. See HTTP response body for details.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/webhooks/UpdateWebhook400response.yaml
          examples:
            invalidUrl:
              summary: Invalid URL
              value:
                message: Bad Request
                details:
                  - "/url: Not a valid http url"
            invalidEvents:
              summary: Unrecognised event type
              value:
                message: Bad Request
                details:
                  - "/events/0: [RECEIVED_123] is invalid"
            unparseableBody:
              summary: Unparseable request body
              value:
                message: Bad Request
                details:
                  - Failed to parse message body.
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "404":
      description: Not found.
