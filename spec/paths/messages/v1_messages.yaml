post:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Messages
  summary: Send messages
  description: >
    Submit one or more (up to 100 per request) SMS, MMS, text to voice or RCS

    messages for delivery.


    The most basic message has the following structure:


    ```javascript


    {
        "messages": [
            {
                "content": "My first message!",
                "destination_number": "+61491570156"
            }
        ]
    }


    ```


    More advanced delivery features can be specified by setting the

    following properties in a message:


    - ```callback_url``` A URL can be included with each message to which

    Webhooks will be pushed to via a HTTP POST request. Webhooks will be sent if
    and when the status of the message changes as it is processed (if the
    delivery report property of the request is set to ```true```) and when
    replies are received. Specifying a callback URL is optional. When provided,
    the URL must use the ```http``` or ```https``` scheme, the hostname must
    conform to RFC 1123 DNS name syntax, and the path must not contain
    whitespace or control characters. Malformed values (for example
    ```https://-invalid.com```, ```https://invalid_.com```, ```https:///path```,
    ```https://:/path```, ```http://.example.com```, ```http://example..com```,
    or a path containing spaces) are rejected with HTTP 400. If any message in
    a multi-message request has an invalid ```callback_url```, no messages are
    sent.


    - ```content``` The content of the message. This can be a Unicode string, up
    to 5,000 characters long.
      Message content is required, except on an RCS message that sends ```rich_content``` instead.

    - ```rich_content``` RCS only. Send an image or file as ```rich_content.media```

    instead of ```content```. See the ```Message``` schema for its fields.

    - ```delivery_report``` Delivery reports can be requested with each

    message. If delivery reports are requested, a webhook will be submitted to
    the ```callback_url``` property specified for the message (or to the
    webhooks)
      specified for the account every time the status of the message changes as it is processed. The
      current status of the message can also be retrieved via the Delivery Reports endpoint of the
      Messages API. Delivery reports are optional and by default will not be requested.

    - ```destination_number``` The destination number the message should be

    delivered to. This should be specified in E.164
      international format. For information on E.164, please refer to http://en.wikipedia.org/wiki/E.164.
      A destination number is required.  
    ⚠️ IMDA TLS Compliance Notice: From 1 April 2026, all requests sending
    messages to Singapore (+65) numbers must use TLS 1.3 or higher. Requests
    using an older TLS version will be rejected with HTTP 422 Unprocessable
    Entity.


    - ```format``` The format specifies which format the message will be

    sent as, ```SMS``` (text message), ```MMS``` (multimedia message),
      ```TTS``` (text to speech) or ```RCS``` (RCS message). With ```TTS``` format, we will call the destination number and read out the
      message using a computer generated voice. Specifying a format is optional, by default ```SMS``` will be used.

    - ```source_number_type``` If a source number is specified, the type of

    source number may also be
      specified. This is recommended when using a source address type that is not an internationally
      formatted number, available options are ```INTERNATIONAL```, ```ALPHANUMERIC``` or ```SHORTCODE```. Specifying a
      source number type is only valid when the ```source_number``` parameter is specified and is optional.
      If a source number is specified and no source number type is specified, the source number type will be
      inferred from the source number, however this may be inaccurate.

    - ```source_number```[optional]  Specify a source number to be used.  Refer
    to the section below for more information on source numbers.  

    ⚠️ The number or sender ID must be registered to your account (from
    1-Mar-2024).

      #### Source number (sender ID)
      
      There are several options for the number or sender ID that will show as the source of an outbound message. Some things to note:
        - If you do not specify a source number, the message will be sent with the default number for your account.
          - The default may be a number you have purchased from us - such as a dedicated number, a 10-digit longcode or toll-free number (US/CA), or a shortcode. Log into the web portal to manage your numbers.
          - If your account has multiple numbers, you can specify which source number to use in the request.
          - If your account does not have a number, your message may be sent using our shared number pool (in certain countries only)
        - `Alpha tag:` In some countries (AU, GB, some others), you may be able to send using an alpha tag - text that represents your brand of business.  Before using an alpha tag, you must register it in the Numbers section of the web portal.
        - `Other numbers:` You may use numbers that you own as the source number, but you must register them in the Numbers section of the web portal to confirm you have a right to use the number.
      If you need to register a large number of source numbers/sender IDs, consider using our [Source Address API](#tag/Source-Address)
      
      ⚠️ If you specify a source_number that is not registered to your account, the message may fail to send, or may be sent with an alternative number.

    - ```media``` The media is used to specify a list of URLs of the media
    file(s) that you are trying to send. 

    Supported file formats include png, jpeg and gif. ```format``` parameter
    must be set to ```MMS``` for this to

    work.


    - ```subject``` The subject field is used to denote subject of the MMS

    message and has a maximum size of 64 characters long. Specifying a

    subject is optional.


    - ```scheduled``` A message can be scheduled for delivery in the future

    by setting the scheduled property.
      The scheduled property expects a date time specified in ISO 8601 format. The scheduled time must be
      provided in UTC and is optional. If no scheduled property is set, the message will be delivered immediately.

    - ```message_expiry_timestamp``` A message expiry timestamp can be

    provided to specify the latest time
      at which the message should be delivered. If the message cannot be delivered before the specified
      message expiry timestamp elapses, the message will be discarded. Specifying a message expiry 
      timestamp is optional.

    - ```metadata``` Metadata can be included with the message which will

    then be included with any delivery
      reports or replies matched to the message. This can be used to create powerful two-way messaging
      applications without having to store persistent data in the application. Up to 10 key / value metadata data
      pairs can be specified in a message. Each key can be up to 100 characters long, and each value up to 
      256 characters long. Specifying metadata for a message is optional.

    The response body of a successful POST request to the messages endpoint

    will include a ```messages``` property which contains a list of all messages
    submitted. The list of

    messages submitted will reflect the list of messages included in the
    request, but each message

    will also contain two new properties, ```message_id``` and ```status```. The
    returned message ID

    will be a 36 character UUID which can be used to check the status of the
    message via the Get Message

    Status endpoint. The status of the message which reflect the status of the
    message at submission

    time which will always be ```queued```. See the Delivery Reports section of
    this documentation for

    more information on message statuses.


    *Note: when sending multiple messages in a request, all messages must be
    valid for the request 

    to be successful. If any messages in the request are invalid, no messages
    will be sent.*
  operationId: SendMessages
  parameters: []
  requestBody:
    description: Request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/messages/Sendmessagesrequest.yaml
        examples:
          standardMessages:
            summary: SMS and MMS
            value:
              messages:
                - callback_url: https://my.callback.url.com
                  content: My first message
                  destination_number: "+61491570156"
                  delivery_report: true
                  format: SMS
                  source_number: "+61491570157"
                  source_number_type: INTERNATIONAL
                - content: My second message
                  destination_number: "+61491570158"
                  format: MMS
                  subject: This is an MMS message
                  media:
                    - https://cdn.example.com/image.jpg
          plainRcsText:
            summary: Plain RCS text with an optional SMS fallback
            value:
              messages:
                - content: Hello from our RCS channel!
                  destination_number: "+61491570156"
                  format: RCS
                  fallback_message:
                    content: Hello from us!
                  source_number: MyBrand
                  source_number_type: ALPHANUMERIC
          rcsWithSuggestions:
            summary: RCS text with tappable suggestions
            value:
              messages:
                - content: Need help with your order?
                  destination_number: "+61491570156"
                  format: RCS
                  suggestions:
                    - type: reply
                      text: Talk to support
                      postback_data: SUPPORT
                    - type: url
                      text: View help
                      url: https://example.com/help
                    - type: dial
                      text: Call us
                      phone_number: "+61391570100"
                    - type: location
                      text: Find store
                      coordinates:
                        latitude: -37.8136
                        longitude: 144.9631
                      label: Melbourne CBD
          rcsRichMedia:
            summary: RCS rich media with an optional SMS fallback
            value:
              messages:
                - destination_number: "+61491570156"
                  format: RCS
                  rich_content:
                    media:
                      url: https://cdn.example.com/promo.png
                      thumbnail_url: https://cdn.example.com/promo_thumb.png
                      filename_override: promo.png
                  fallback_message:
                    content: Check out our promo
                  source_number: MyBrand
                  source_number_type: ALPHANUMERIC
    required: true
  responses:
    "202":
      description: Messages were accepted for processing
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/messages/Sendmessagesresponse.yaml
    "400":
      description: >
        Unexpected error in API call. See HTTP response body for details.
        Returned when the request fails to parse or message fields are invalid,
        including a malformed per-message `callback_url` (unsupported scheme,
        malformed hostname or DNS syntax, or path containing whitespace or
        control characters). If any message in a multi-message request is
        invalid, no messages are sent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400response.yaml
          examples:
            invalidDestinationNumber:
              summary: Invalid destination number
              value:
                message: >-
                  Request failed to parse correctly. Please ensure input is valid
                  and try again.
                details:
                  - >-
                    /messages/0/destination_number: International address must be
                    between 8 and 15 characters excluding the first '+',
                    International address contains invalid characters.
            invalidCallbackUrl:
              summary: Invalid callback URL
              value:
                message: >-
                  Request failed to parse correctly. Please ensure input is valid
                  and try again.
                details:
                  - >-
                    /messages/0/callbackUrl: Invalid callback url
            richContentWithContent:
              summary: RCS rich_content combined with content
              value:
                message: >-
                  Request failed to parse correctly. Please ensure input is valid
                  and try again.
                details:
                  - '/messages/0/: content conflicts with rich_content'
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403response.yaml
    "402":
      description: >-
        The account is not enabled to send RCS. Contact your account manager
        to have RCS enabled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400response.yaml
