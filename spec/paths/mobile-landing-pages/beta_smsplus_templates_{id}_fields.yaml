get:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Mobile Landing Pages (beta)
  summary: Get Templates Fields Definition
  description: Returns a list of Template Field Definition.
  operationId: GetTemplatesFieldsDefinition
  parameters:
    - name: id
      in: path
      description: Template Id
      required: true
      style: simple
      schema:
        type: string
        example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
  responses:
    "200":
      description: The list of template parameters required in this template
      headers: {}
      content:
        application/json:
          schema:
            $ref: >-
              ../../components/schemas/mobile-landing-pages/GetTemplatesFieldsDefinitionresponse.yaml
          example:
            fields:
              fontFamilyURL1:
                type: TEXT
              secondaryButtonTextColor:
                type: TEXT
              fontFamilyURL3:
                type: TEXT
              pageTitle:
                type: TEXT
              fontFamilyURL2:
                type: TEXT
              pageTextColor:
                type: TEXT
              barcodeHeight:
                type: TEXT
              imageHeaderUrl:
                type: IMAGE
              barcodeMargin:
                type: TEXT
              logoLink:
                type: TEXT
              primaryButtonLink:
                type: TEXT
              primaryButtonBackgroundColor:
                type: TEXT
              secondaryButtonLink:
                type: TEXT
              barcodeWidth:
                type: TEXT
              primaryButtonText:
                type: TEXT
              headline:
                type: TEXT
              headlineColor:
                type: TEXT
              pageText:
                type: TEXT
              secondaryButtonBackgroundColor:
                type: TEXT
              imageLinkPreviewUrl:
                type: TEXT
              pageTextFontFamily:
                type: TEXT
              secondaryButtonText:
                type: TEXT
              headlineFontFamily:
                type: TEXT
              barcodeLineColor:
                type: TEXT
              barcodeValue:
                type: TEXT
              primaryButtonTextColor:
                type: TEXT
              imageLogoUrl:
                type: TEXT
              barcodeDisplayValue:
                type: TEXT
              buttonFontFamily:
                type: TEXT
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "402":
      description: Account is not postpaid, or does not have Mobile Landing Pages Enabled.
