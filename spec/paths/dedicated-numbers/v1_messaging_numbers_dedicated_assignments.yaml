get:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Dedicated Numbers
  summary: Get assigned numbers
  description: Retrieves the list of assigned dedicated numbers.
  operationId: GetAssignedNumbers
  parameters:
    - name: page_size
      in: query
      description: Number of results returned per page, default 50
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        example: 20
    - name: token
      in: query
      description: >-
        Pagination token from a previous response `pagination.next_token`.
        Pass it as `token` to fetch the next page.
      style: form
      explode: true
      schema:
        type: string
        format: uuid
        example: 0428d673-0f75-4063-9493-e89d75f13438
    - name: matching
      in: query
      description: Filters results by a pattern of digits contained within the number
      style: form
      explode: true
      schema:
        type: string
        example: "223344"
    - name: country
      in: query
      description: >-
        Filter results by ISO_3166 country code, 2 character code to filter
        available numbers by country
      style: form
      explode: true
      schema:
        type: string
        example: AU
    - name: label
      in: query
      description: Filter results by a matching label
      style: form
      explode: true
      schema:
        type: string
        example: LabelTest0
    - name: service_types
      in: query
      description: Filter results by capabilities
      style: form
      explode: true
      schema:
        $ref: ../../components/schemas/dedicated-numbers/service_types.yaml
    - name: classification
      in: query
      description: Filter results by Number Classification
      style: form
      explode: true
      schema:
        $ref: ../../components/schemas/dedicated-numbers/Classification.yaml
    - name: status
      in: query
      description: Filter results by number status
      style: form
      explode: true
      schema:
        $ref: ../../components/schemas/dedicated-numbers/Status.yaml
    - name: type
      in: query
      description: >-
        Filter results by a single number type. When both `type` and `types`
        are provided, `types` takes precedence.
      style: form
      explode: true
      schema:
        $ref: ../../components/schemas/dedicated-numbers/Type.yaml
    - name: types
      in: query
      description: >
        Filter results by one or more number types. Pass repeated query parameters
        or a comma-separated list (for example `types=MOBILE,LANDLINE,TOLL_FREE`).
      style: form
      explode: true
      schema:
        $ref: ../../components/schemas/dedicated-numbers/Types.yaml
  responses:
    "200":
      description: OK
      headers: {}
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: ../../components/schemas/dedicated-numbers/AssignedNumberListResponse.yaml
          example:
            pagination:
              next_token: 0428d673-0f75-4063-9493-e89d75f13438
              page_size: 5
            data:
              - assignment:
                  metadata:
                    Key1: value1
                    Key2: value2
                  label: LabelTest0
                  id: be3cb602-7c00-4c87-ae4b-b8defc04f179
                  number_id: b9ee3fe8-2c20-47b1-96e9-c5d12d7ed985
                  account_id: my_account
                  vendor_id: MessageMedia
                number:
                  id: 03cf54ad-a4a3-4cd1-afd5-e0ca2cf158a3
                  phone_number: "61436489205"
                  country: AU
                  type: MOBILE
                  classification: BRONZE
                  available_after: "2019-08-06T23:56:15.633Z"
                  capabilities:
                    - SMS
                  status: ASSIGNED
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403response.yaml
          example:
            message: Invalid authentication credentials
