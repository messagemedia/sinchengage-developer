get:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Source Address
  summary: Get sender address by id
  operationId: GetSenderAddressById
  description: |
    Retrieve an approved sender address by its **sender address** UUID (from **Get all approved sender addresses**).
    Do not use the request UUID returned by **Request a Sender Address**.
  parameters:
    - name: id
      in: path
      description: Sender address UUID (from GET .../addresses), not the request UUID
      required: true
      schema:
        type: string
        format: uuid
        example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
  responses:
    "200":
      description: A sender address for your account only
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/source-address/GetSenderAddress.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400response.yaml
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403response.yaml
delete:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Source Address
  summary: Delete Sender Address
  description: |
    Remove an approved sender address from your account.

    The path `id` must be the **sender address** UUID from **Get all approved sender addresses**.
    Using the **request** UUID from **Request a Sender Address** will return `404 Not found`.
  operationId: deleteSenderAddressUsingDELETE
  parameters:
    - name: id
      in: path
      description: Sender address UUID (from GET .../addresses), not the request UUID
      required: true
      schema:
        type: string
        format: uuid
        example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
    - name: reason
      in: query
      description: A string detailing why the sender address is being removed
      required: true
      schema:
        type: string
        example: I%20want%20do%20delete%20this%20number.
  responses:
    "202":
      description: Accepted
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400response.yaml
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403response.yaml
    "404":
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/404response.yaml
patch:
  security:
    - basic_auth: []
    - hmac_auth: []
  tags:
    - Source Address
  summary: Update My Own Number Label
  description: |
    Update label for my own number only.
    The path `id` must be the **sender address** UUID from **Get all approved sender addresses**, not the request UUID.
  operationId: updateSenderAddressUsingPATCH
  parameters:
    - name: id
      in: path
      description: Sender address UUID (from GET .../addresses), not the request UUID
      required: true
      schema:
        type: string
        format: uuid
        example: 7ca628a8-08b0-4e42-aeb8-960b37049c31
  requestBody:
    description: Input the label need to update
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/source-address/PatchLabelMyOwnNumber.yaml
        example:
          label: ExampleLabel
    required: true
  responses:
    "200":
      description: OK
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/source-address/GetSenderAddress.yaml
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/400response.yaml
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/403response.yaml
    "404":
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/404response.yaml
